name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-release
          cache-targets: true

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      # tests are gated by ci.yml on every push to main; the release tag points
      # at a tested commit, so the release job does not recompile them (the test
      # build of the large generated netbox-openapi crate OOMs the runner).

      - name: install sbom tool
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          for manifest in "$GITHUB_WORKSPACE"/crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            (cd /tmp && cargo cyclonedx --manifest-path "$manifest" \
              --format json \
              --override-filename "sbom-${REF_NAME}-${crate}.cdx" \
              --all-features)
          done

      - name: collect and clean sbom files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/netbox-sbom

          # Collect SBOMs emitted in /tmp.
          find /tmp -maxdepth 1 -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec cp {} /tmp/netbox-sbom/ \;

          # Some cargo-cyclonedx invocations can emit next to manifests; collect then remove
          # to keep the git working tree clean for cargo publish.
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec cp {} /tmp/netbox-sbom/ \; \
            -delete

      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/netbox-sbom/sbom-${{ github.ref_name }}-*.cdx.json"

      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: /tmp/netbox-sbom/sbom-${{ github.ref_name }}-*.cdx.json

      - name: verify clean tree before publish
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      # Each step tolerates "already uploaded" / "already exists on crates.io"
      # so a re-tagged release can finish what an earlier one left half-published.
      - name: publish netbox-openapi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netbox-openapi --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"

      - name: publish netbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netbox --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"

      - name: publish netbox-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netbox-cli --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"
