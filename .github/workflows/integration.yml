name: Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  smoke-and-golden:
    runs-on: big
    timeout-minutes: 45
    env:
      NETBOX_URL: http://localhost:8000
      NETBOX_TOKEN: '0123456789abcdef0123456789abcdef01234567'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis-cache:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      netbox:
        image: netboxcommunity/netbox:v4.5.8
        env:
          ALLOWED_HOSTS: "*"
          DB_HOST: postgres
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: redis
          REDIS_DATABASE: "0"
          REDIS_CACHE_HOST: redis-cache
          REDIS_CACHE_DATABASE: "1"
          SUPERUSER_NAME: admin
          SUPERUSER_EMAIL: admin@example.com
          SUPERUSER_PASSWORD: admin
          SECRET_KEY: thisisaverylongfixedsecretkeyforciandtestingonly123
        ports:
          - 8000:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Wait for NetBox readiness
        run: |
          set -euo pipefail
          # v4.5.8 container initialisation (migrations, static files, data
          # fixtures) can take 15+ minutes on the first run.  Poll without
          # authentication — any HTTP response means the web server is up.
          for i in $(seq 1 300); do
            http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${NETBOX_URL}/login/" 2>/dev/null || true)
            if [ "$http_code" != "000" ] && [ -n "$http_code" ]; then
              echo "NetBox is ready (HTTP ${http_code}) after ${i} checks"
              exit 0
            fi
            sleep 5
          done

          echo "NetBox failed readiness checks; dumping recent service logs"
          docker logs "${{ job.services.netbox.id }}" --tail 200 || true
          exit 1

      - name: Provision CI API token
        run: |
          # The v4.5.8 image only auto-creates v2 (peppered) tokens, which
          # require "Bearer nbt_<key>.<plaintext>" auth.  The Rust client
          # sends "Token <key>", so we create a classic v1 token instead.
          docker exec "${{ job.services.netbox.id }}" \
            /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell -c "
          from users.models import Token
          from django.contrib.auth.models import User
          u = User.objects.get(username='admin')
          t = Token.objects.create(user=u, key='${NETBOX_TOKEN}')
          print(f'v1 token provisioned (key={t.key[:8]}...)')
          "
          # Verify the token works
          curl -fsS -H "Authorization: Token ${NETBOX_TOKEN}" \
            "${NETBOX_URL}/api/status/" >/dev/null
          echo "Token verified against /api/status/"

      - name: Install oasdiff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh api repos/tufin/oasdiff/releases/latest \
            --jq '.assets[] | select(.name | test("linux_amd64.tar.gz")) | .browser_download_url')
          curl -sSfL "$url" | tar -xz -C /usr/local/bin

      - name: Check OpenAPI schema for breaking changes
        run: |
          curl -sf "${NETBOX_URL}/api/schema/?format=json" \
            -H "Authorization: Token ${NETBOX_TOKEN}" \
            -o /tmp/live-schema.json

          # Deduplicate paths with different parameter names (e.g. /foo/{id}/
          # and /foo/{name}/) which oasdiff treats as duplicate endpoints.
          python3 <<'PY'
          import json, re

          def norm(p):
              return re.sub(r'\{[^}]+\}', '{p}', p)

          def dedup(src, dst):
              with open(src) as f:
                  schema = json.load(f)
              seen, paths = set(), {}
              for path, methods in schema.get('paths', {}).items():
                  n = norm(path)
                  if n not in seen:
                      seen.add(n)
                      paths[path] = methods
              schema['paths'] = paths
              with open(dst, 'w') as f:
                  json.dump(schema, f)

          dedup('scripts/openapi-schema.json', '/tmp/base-deduped.json')
          dedup('/tmp/live-schema.json', '/tmp/live-deduped.json')
          PY

          oasdiff breaking /tmp/base-deduped.json /tmp/live-deduped.json --fail-on ERR

      - name: Run client smoke tests
        env:
          NETBOX_INSECURE: "1"
        run: ./scripts/run_smoke.sh

      - name: Run CLI golden tests
        env:
          NETBOX_INSECURE: "1"
        run: cargo test -p netbox-cli --test golden -- --ignored
